# コンペごとのプロジェクト定義の雛形。
#
# 使い方:
#   1. cp -r kaggle/_template kaggle/<コンペ名>
#   2. このファイルの name を <コンペ名> に書き換える
#   3. 最上位の pyproject.toml の [tool.uv.workspace] members に
#      "kaggle/<コンペ名>" を追記する
#   4. uv sync
#
# dependencies には、src/ の中で実際に import するものだけを書く。
# 「入れておけば動く」で増やすと、何が本当に必要かが分からなくなる。

[project]
name = "kaggle-template"
version = "0.1.0"
description = "<コンペ名>への取り組み"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "matplotlib>=3.8", "seaborn>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ の直下にパッケージ用のディレクトリを1つ作り、その名前をここに書く。
# 例: src/titanic/ を作ったなら ["src/titanic"]。
# "src" のままにすると、src という名前のパッケージができてしまう。
packages = ["src/<パッケージ名>"]
